<!DOCTYPE HTML>
<html>
<head>
    <title>Tango Software | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/styles.css" type="text/css" rel="stylesheet">
    <link href="assets/css/elements.css" type="text/css" rel="stylesheet">
    <link href="assets/css/media-limits.css" type="text/css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/38ef0d6706.js" crossorigin="anonymous"></script>
    <script src="assets/js/persistent-elements.js"></script>
    <script src="assets/js/templates.js"></script>
    <script
        src="https://code.jquery.com/jquery-3.3.1.js"
        integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
        crossorigin="anonymous">
    </script>
</head>
<body class="container preload">
    <script type="module" src="static/js/index.js"></script>

    <aside class="sidebar">
        <ul>
            <li>
                <a id="toggle-sidebar">
                    <i class="fa fa-angle-double-left"></i>
                    <span>Collapse</span>
                </a>
            </li>
            <li>
                <a href="/" id="home" class="nav__link" data-link>
                    <i class="fa fa-home"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="../projects" id="projects" class="nav__link" data-link>
                    <i class="fa fa-lightbulb"></i>
                    <span>Projects</span>
                </a>
            </li>
            <li>
                <a href="../preview" id="preview" class="nav__link" data-link>
                    <i class="fa fa-magnifying-glass"></i>
                    <span>Preview</span>
                </a>
            </li>
            <li>
                <a href="#" id="documentation" class="nav__link" data-link>
                    <i class="fa fa-book"></i>
                    <span>Documentation</span>
                </a>
            </li>
            <li>
                <a href="#" onclick="toggleSubMenu(this)" id="settings">
                    <i class="fa fa-cog"></i>
                    <span>Settings</span>
                    <i class="fa fa-angle-right"></i>
                </a>
                <ul class="sub-menu">
                    <div>
                        <li><a href="#" class="nav__link" data-link>nothing</a></li>
                        <li><a href="#" class="nav__link" data-link>here</a></li>
                        <li><a href="#" class="nav__link" data-link>yet</a></li>                    
                    </div>
                </ul>
            </li>
            <li>
                <a onclick="themeToggle()" id="theme-toggle">
                    <i class="fa fa-moon"></i>
                    <span>Toggle Dark Mode</span>
                </a>
            </li>
        </ul>
    </aside>

    <div id="app"></div>
    
    <script> 
        $(function(){    
            let element = document.getElementById('home');
            element.classList.add("active-page");
        });
    </script>
</body>
</html>
